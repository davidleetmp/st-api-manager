<div id="st_api_modal_template" class="st-api-modal-wrapper">
    <div class="st-api-modal-header">
        <h3 class="st-api-modal-title">
            <i class="fa-solid fa-sliders"></i>
            <span id="st_api_modal_heading">新增 / 编辑 API 配置</span>
        </h3>
    </div>

    <!-- Quick Preset Selector -->
    <div class="st-api-form-row">
        <label class="st-api-label"><i class="fa-solid fa-wand-magic-sparkles"></i> 快速选择模板 / 厂商：</label>
        <div class="st-api-preset-chips">
            <button type="button" class="st-api-chip" data-preset="deepseek">DeepSeek 官方</button>
            <button type="button" class="st-api-chip" data-preset="openai">OpenAI 官方</button>
            <button type="button" class="st-api-chip" data-preset="claude">Anthropic Claude</button>
            <button type="button" class="st-api-chip" data-preset="gemini">Google Gemini</button>
            <button type="button" class="st-api-chip" data-preset="siliconflow">硅基流动 (SiliconFlow)</button>
            <button type="button" class="st-api-chip" data-preset="openrouter">OpenRouter</button>
            <button type="button" class="st-api-chip" data-preset="ollama">Ollama (本地)</button>
            <button type="button" class="st-api-chip" data-preset="custom">清空/自定义</button>
        </div>
    </div>

    <div class="st-api-modal-body">
        <input type="hidden" id="st_api_form_id" value="" />

        <!-- Row 1: Name & Provider -->
        <div class="st-api-form-grid">
            <div class="st-api-form-col">
                <label for="st_api_form_name" class="st-api-label">
                    <span class="st-api-required">*</span> API 别名 / 名称：
                </label>
                <input type="text" id="st_api_form_name" class="text_pole" placeholder="例如：DeepSeek 生产主力、Claude 备用" />
            </div>
            <div class="st-api-form-col">
                <label for="st_api_form_provider" class="st-api-label">
                    <span class="st-api-required">*</span> 协议 / 厂商类型：
                </label>
                <select id="st_api_form_provider" class="text_pole">
                    <option value="deepseek">DeepSeek (OpenAI 兼容)</option>
                    <option value="openai">OpenAI</option>
                    <option value="claude">Anthropic / Claude</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="siliconflow">硅基流动 (SiliconFlow)</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="ollama">Ollama (本地)</option>
                    <option value="custom">自定义 / 其他中转</option>
                </select>
            </div>
        </div>

        <!-- Row 2: API URL -->
        <div class="st-api-form-row">
            <label for="st_api_form_url" class="st-api-label">
                <span class="st-api-required">*</span> API 基础网址 (Endpoint / Base URL)：
            </label>
            <div class="st-api-input-group">
                <input type="text" id="st_api_form_url" class="text_pole" placeholder="https://api.deepseek.com/v1" />
                <button type="button" id="st_api_btn_normalize_url" class="menu_button" title="标准化修复末尾斜杠和/v1">
                    <i class="fa-solid fa-wrench"></i> 规范化
                </button>
            </div>
            <small class="st-api-hint">支持完整地址或兼容 Base URL，如 <code>https://api.openai.com/v1</code></small>
        </div>

        <!-- Row 3: API Key -->
        <div class="st-api-form-row">
            <label for="st_api_form_key" class="st-api-label">
                API 密钥 (API Key / Token)：
            </label>
            <div class="st-api-input-group">
                <input type="password" id="st_api_form_key" class="text_pole" placeholder="sk-..." autocomplete="off" />
                <button type="button" id="st_api_btn_toggle_key" class="menu_button" title="显示 / 隐藏密钥">
                    <i class="fa-solid fa-eye"></i>
                </button>
                <button type="button" id="st_api_btn_paste_key" class="menu_button" title="从剪贴板粘贴">
                    <i class="fa-solid fa-paste"></i>
                </button>
            </div>
            <small class="st-api-hint"><i class="fa-solid fa-lock"></i> 密钥存储在本地浏览器中，请勿与他人共用包含私密密钥的文件。</small>
        </div>

        <!-- Row 4: Model & Fetch Models -->
        <div class="st-api-form-row">
            <label for="st_api_form_model" class="st-api-label">
                <span class="st-api-required">*</span> 选择 / 填写模型 (Model)：
            </label>
            <div class="st-api-input-group">
                <input type="text" id="st_api_form_model" class="text_pole" list="st_api_model_datalist" placeholder="例如：deepseek-chat, gpt-4o, claude-3-5-sonnet-20241022" />
                <datalist id="st_api_model_datalist"></datalist>
                <button type="button" id="st_api_btn_fetch_models" class="menu_button" title="从当前 API 网址在线拉取可用模型列表">
                    <i class="fa-solid fa-cloud-arrow-down"></i> <span id="st_api_fetch_btn_text">拉取模型</span>
                </button>
            </div>
        </div>

        <!-- Collapsible Tabs for Advanced Settings -->
        <div class="st-api-tabs">
            <div class="st-api-tab-nav">
                <button type="button" class="st-api-tab-btn active" data-tab="params"><i class="fa-solid fa-sliders"></i> 生成参数</button>
                <button type="button" class="st-api-tab-btn" data-tab="headers"><i class="fa-solid fa-heading"></i> 附加请求头</button>
                <button type="button" class="st-api-tab-btn" data-tab="body"><i class="fa-solid fa-code"></i> 自定义 Body</button>
                <button type="button" class="st-api-tab-btn" data-tab="prompt"><i class="fa-solid fa-comment-dots"></i> 预设提示词</button>
                <button type="button" class="st-api-tab-btn" data-tab="notes"><i class="fa-solid fa-note-sticky"></i> 备注信息</button>
            </div>

            <!-- Tab 1: Generation Params -->
            <div class="st-api-tab-pane active" id="st_tab_params">
                <div class="st-api-form-grid">
                    <div class="st-api-form-col">
                        <label for="st_api_form_temperature" class="st-api-label">Temperature (温度)：</label>
                        <input type="number" id="st_api_form_temperature" class="text_pole" step="0.05" min="0" max="2" placeholder="默认 1.0" />
                    </div>
                    <div class="st-api-form-col">
                        <label for="st_api_form_top_p" class="st-api-label">Top P：</label>
                        <input type="number" id="st_api_form_top_p" class="text_pole" step="0.05" min="0" max="1" placeholder="默认 1.0" />
                    </div>
                </div>
                <div class="st-api-form-grid">
                    <div class="st-api-form-col">
                        <label for="st_api_form_max_tokens" class="st-api-label">最大输出 Token (Max Tokens)：</label>
                        <input type="number" id="st_api_form_max_tokens" class="text_pole" min="1" placeholder="例如：4096" />
                    </div>
                    <div class="st-api-form-col">
                        <label for="st_api_form_context_len" class="st-api-label">上下文上限 (Context Tokens)：</label>
                        <input type="number" id="st_api_form_context_len" class="text_pole" min="1" placeholder="例如：64000" />
                    </div>
                </div>
                <div class="st-api-checkbox-row">
                    <label class="checkbox_label">
                        <input type="checkbox" id="st_api_form_stream" checked />
                        <span>启用流式传输响应 (Streaming)</span>
                    </label>
                </div>
            </div>

            <!-- Tab 2: Custom Headers -->
            <div class="st-api-tab-pane" id="st_tab_headers">
                <label for="st_api_form_headers" class="st-api-label">自定义 HTTP 请求头 (JSON 格式)：</label>
                <textarea id="st_api_form_headers" class="text_pole st-api-textarea-code" rows="4" placeholder='{
  "HTTP-Referer": "https://sillytavern.app",
  "X-Title": "SillyTavern Custom",
  "User-Agent": "ST-API-Manager/1.0"
}'></textarea>
                <small class="st-api-hint">用于中转站、代理或需要特定 Header 的专属通道。</small>
            </div>

            <!-- Tab 3: Custom Request Body -->
            <div class="st-api-tab-pane" id="st_tab_body">
                <label for="st_api_form_custom_body" class="st-api-label">自定义额外 Payload 参数 (JSON 格式)：</label>
                <textarea id="st_api_form_custom_body" class="text_pole st-api-textarea-code" rows="4" placeholder='{
  "frequency_penalty": 0.0,
  "presence_penalty": 0.0,
  "repetition_penalty": 1.05
}'></textarea>
                <small class="st-api-hint">请求发送时合并到顶层 JSON 请求体中。</small>
            </div>

            <!-- Tab 4: System Prompt -->
            <div class="st-api-tab-pane" id="st_tab_prompt">
                <label for="st_api_form_sysprompt" class="st-api-label">默认系统提示词 / 角色前缀 (System Prompt)：</label>
                <textarea id="st_api_form_sysprompt" class="text_pole" rows="4" placeholder="可选：为此 API 配置绑定的专属预设前置指令..."></textarea>
            </div>

            <!-- Tab 5: Notes -->
            <div class="st-api-tab-pane" id="st_tab_notes">
                <label for="st_api_form_notes" class="st-api-label">备注说明 / 附加信息：</label>
                <textarea id="st_api_form_notes" class="text_pole" rows="4" placeholder="例如：此 Key 每月限额 $50，主要用于长篇小说写作与破限测试..."></textarea>
            </div>
        </div>

        <!-- Active Checkbox & Test Status -->
        <div class="st-api-form-footer-options">
            <label class="checkbox_label">
                <input type="checkbox" id="st_api_form_set_active" />
                <span><b>保存后立即设为当前有效 API</b></span>
            </label>
            <div id="st_api_modal_test_result" class="st-api-test-result-box" style="display:none;"></div>
        </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="st-api-modal-footer">
        <button type="button" id="st_api_btn_test_modal" class="menu_button">
            <i class="fa-solid fa-bolt"></i> 测试连通性
        </button>
        <div class="st-api-footer-right-buttons">
            <button type="button" id="st_api_btn_cancel_modal" class="menu_button">
                取消
            </button>
            <button type="button" id="st_api_btn_save_modal" class="menu_button menu_button_primary">
                <i class="fa-solid fa-floppy-disk"></i> 保存配置
            </button>
        </div>
    </div>
</div>
